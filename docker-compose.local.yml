version: "3.8"
services:
  mongo:
    image: mongo:4.2.0
    container_name: ra_database
    hostname: ra_database
    environment:
      - PUID=$DOCKER_UID
      - PGID=$DOCKER_GID
      - MONGO_INITDB_ROOT_USERNAME=r2
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=ra_data
    volumes:
      - $HOST_DB_STORAGE_PATH:/data/db
    ports:
      - 27017:27017
    networks:
      backend:
        ipv4_address: 172.23.0.51
    restart: unless-stopped
  
  mongo_ui:
    image: samueltallet/mongodb-php-gui
    container_name: ra_database_ui
    hostname: ra_database_ui
    ports:
      - 5001:5000
    extra_hosts:
      - "localhost:172.17.0.1"
    networks:
      backend:
        ipv4_address: 172.23.0.52
    restart: unless-stopped

  ra_frontend:
    build:
      context: ./dashboard
      dockerfile: ./Dockerfile
      args:
        - APP_WORKDIR=$APP_WORKDIR
      # platforms:
      #   - linux/amd64
      #   - linux/arm64
    image: robylynn/rac:ra_frontend
    container_name: ra_frontend
    hostname: ra_frontend
    environment:
      - HOST=0.0.0.0
      - PORT=80
      - CONTROLLER_URI=172.23.0.50:8000
      - ROS_HOST=host.docker.internal
      # - NEXTAUTH_URL=http://192.168.2.201:80
      - NEXTAUTH_URL=http://192.168.10.10:80
      - ENABLE_AUTHENTICATION=true
      - DEBUG=false

    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 3000:3000
      - 80:80  
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    restart: unless-stopped

  ra_backend:
    build: 
      # context: ./backend
      context: ./
      dockerfile: ./backend/Dockerfile
      args:
        - APP_WORKDIR=$APP_WORKDIR
        - PROJECT_ROOT=$PROJECT_ROOT  
        # - BACKEND_MODULE_NAME=$BACKEND_MODULE_NAME
        # - CONTAINER_DEPLOYMENT_FILES_DIR=$CONTAINER_DEPLOYMENT_FILES_DIR
        # - CONTAINER_DEPLOYMENT_INTERMEDIATE_DIRECTORY=$CONTAINER_DEPLOYMENT_INTERMEDIATE_DIRECTORY
        # - DEPLOYMENT_USER_CODE_DIR=$DEPLOYMENT_USER_CODE_DIR
        # - DOCKER_UID=$DOCKER_UID
        # - DOCKER_GID=$DOCKER_GID
        # - HOST_LOG_FILE_DIR=$HOST_LOG_FILE_DIR
        # - HOST_CONFIG_FILE_DIR=$HOST_CONFIG_FILE_DIR
      # platforms:
      #   - linux/amd64
      #   - linux/arm64
    image: robylynn/rac:ra_backend
    container_name: ra_backend
    hostname: ra_backend
    environment:
      - APP_WORKDIR=$APP_WORKDIR
      - CONFIG_FILE=$CONFIG_FILE
      - CONFIG_FILE_DIR=$CONFIG_FILE_DIR
      - CONTAINERIZED=true
      - DATABASE_CONTAINER_NAME=ra_database
      - HOST_HOSTNAME=$HOST_HOSTNAME
    volumes:
      - $PROJECT_ROOT/$CONFIG_FILE_DIR:$APP_WORKDIR/config:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 8000:8000
    networks:
      backend:
        ipv4_address: 172.23.0.50
    user: "${DOCKER_UID}:${DOCKER_GID}"
    restart: unless-stopped

  rosbridge_websocket:
    container_name: rosbridge_websocket
    build:
      dockerfile: Dockerfile
      context: ./rosbridge-server
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    # <<: *common-config
    volumes:
      - /home/r2/ros2_ws:/home/r2/ros2_ws
    network_mode: host
    ipc: host
    ports:
      - 9090:9090
    # command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml
    # command: bash -c "source /home/r2/ros2_ws/install/setup.bash && ros2 launch rosbridge_server rosbridge_websocket_launch.xml"
    command: bash -c "echo $RMW_IMPLEMENTATION && ros2 topic list && source /home/r2/ros2_ws/install/setup.bash && ros2 run rosbridge_server rosbridge_websocket"
  
  microros-agent:
    container_name: microros-agent
    image: microros/micro-ros-agent:humble
    command: udp4 -p 8888 -v4
    stdin_open: true # docker run -i
    tty: true        # docker run -t
    privileged: true
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
    network_mode: host
    ports:
      # - 8888:8888
      - 9999:9999
    restart: unless-stopped

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24