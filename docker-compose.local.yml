version: "3.8"
services:
  ra_frontend:
    build:
      # context: ./dashboard
      context: ./
      dockerfile: ./dashboard/Dockerfile
      # args:
      #   - APP_WORKDIR=$APP_WORKDIR
      # platforms:
      #   - linux/amd64
      #   - linux/arm64
    # image: robylynn/rac:ra_frontend
    image: ra_frontend
    container_name: ra_frontend
    hostname: ra_frontend
    environment:
      - HOST=0.0.0.0
      - PORT=80
      - CONTROLLER_URI=ra_backend:8000
      - ROS_HOST=host.docker.internal
      - AUTH_TRUST_HOST=true
      - ENABLE_AUTHENTICATION=true
      - DEBUG=false
      - AUTH_SECRET=vO9zvd1j7tG1AMGl+hK41Jbd3rqy0LuRG/Tt5k0Rc4A=
      - LOG_LEVEL='info'
      - NODE_ENV='production'
    env_file:
      - ./dashboard/.env.production
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 3000:3000
      - 80:80  
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # networks:
    #   - backend
    restart: unless-stopped

  # ra_host_services:
  #   build: 
  #     context: ./
  #     dockerfile: ./host_services/Dockerfile
  #     args:
  #       - APP_WORKDIR=$APP_WORKDIR
  #       - PROJECT_ROOT=$PROJECT_ROOT  
  #   image: robylynn/rac:ra_host_services
  #   container_name: ra_host_services
  #   hostname: ra_host_services
  #   environment:
  #     - APP_WORKDIR=$APP_WORKDIR
