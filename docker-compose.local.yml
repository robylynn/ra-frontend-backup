version: "3.8"
services:
  ra_frontend:
    build:
      # context: ./dashboard
      context: ./
      dockerfile: ./dashboard/Dockerfile
      # args:
      #   - APP_WORKDIR=$APP_WORKDIR
      # platforms:
      #   - linux/amd64
      #   - linux/arm64
    # image: robylynn/rac:ra_frontend
    image: ra_frontend
    container_name: ra_frontend
    hostname: ra_frontend
    environment:
      - HOST=0.0.0.0
      - PORT=80
      - CONTROLLER_URI=ra_backend:8000
      - ROS_HOST=host.docker.internal
      - AUTH_TRUST_HOST=true
      - ENABLE_AUTHENTICATION=true
      - DEBUG=false
      - AUTH_SECRET=vO9zvd1j7tG1AMGl+hK41Jbd3rqy0LuRG/Tt5k0Rc4A=
      - LOG_LEVEL='info'
      - NODE_ENV='production'
    env_file:
      - ./dashboard/.env.production
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 3000:3000
      - 80:80  
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ra_backend
    restart: unless-stopped

  ra_host_services:
    build: 
      context: ./
      dockerfile: ./host_services/Dockerfile
      # args:
      #   - APP_WORKDIR=$APP_WORKDIR
      #   - PROJECT_ROOT=$PROJECT_ROOT  
    image: robylynn/rac:ra_host_services
    container_name: ra_host_services
    # hostname: ra_host_services
    environment:
      # - APP_WORKDIR=$APP_WORKDIR
      - HOST_SERVICES_PORT=$HOST_SERVICES_PORT
      # - CONTAINERIZED=true
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/dbus:/var/run/dbus
    ports:
      - ${HOST_SERVICES_PORT}:${HOST_SERVICES_PORT}
    healthcheck:
      # Use curl to check a health endpoint on the web server.
      # The `$$` is needed to escape the `$` for the shell.
      test: ["CMD-SHELL", "curl -f http://localhost:${HOST_SERVICES_PORT}/healthy || exit 1"]
      # How often to run the check.
      interval: 30s
      # How long to wait for a response before timing out.
      timeout: 10s
      # The number of consecutive failures before the container is considered unhealthy.
      retries: 3
      # The initial grace period for the container to start.
      start_period: 10s
    privileged: true
    network_mode: host
    user: "0:0"
    restart: unless-stopped
  
  # # Python FastAPI API service
  ra_backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      args:
        API_PORT: ${API_PORT}
    container_name: ra_backend
    environment:
      # These are now primarily for internal Docker networking/Grafana
      # POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      
      API_PORT: ${API_PORT}
      # NEW: Pass YAML config file path and deployment environment
      DB_CONFIG_FILE: ${DB_CONFIG_FILE}
      DEPLOYMENT_ENV: ${DOCKER_DEPLOYMENT_ENV}
      
      # ENABLE_CLOUD_DB, CLOUD_DB_COUNT, CLOUD_DATABASE_URL_X are no longer needed here
      # as they are read directly from the YAML config within the app.
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      timescaledb:
        condition: service_healthy
      ra_host_services:
        condition: service_healthy
    restart: unless-stopped
    command: ["uvicorn", "backend.api.main:backend_api", "--host", "0.0.0.0", "--port", "${API_PORT:-5000}"]
    volumes: # NEW: Ensure config directory is mounted
      - ./config:/app/config

  # TimescaleDB service (Local)
  timescaledb:
    image: timescale/timescaledb:latest-pg16 # CHANGED: Corrected image name
    container_name: timescaledb
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./scripts/database_setup/init_databases.sh:/docker-entrypoint-initdb.d/init_databases.sh
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_TEST_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Grafana service
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3001:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  label_studio:
    image: heartexlabs/label-studio:latest
    container_name: label_studio
    ports:
      - "8080:8080"
    volumes:
      - label_studio_data:/label-studio/data
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      # Use PostgreSQL database
      - DJANGO_DB=postgresql
      - POSTGRE_NAME=${LABEL_STUDIO_DB_NAME}
      - POSTGRE_HOST=timescaledb
      - POSTGRE_PORT=5432
      - POSTGRE_USER=${POSTGRES_USER:-label_studio_user}
      - POSTGRE_PASSWORD=${POSTGRES_PASSWORD:-label_studio_password}
      - LABEL_STUDIO_WITHOUT_USER_ACCOUNT=1
    restart: always # Keep Label Studio running

volumes:
  timescaledb_data:
  grafana_data:
  label_studio_data:
