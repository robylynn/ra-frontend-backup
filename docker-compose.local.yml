  #     - CONTAINERIZED=true
  #   volumes:
  #     - /etc/timezone:/etc/timezone:ro
  #     - /etc/localtime:/etc/localtime:ro
  #     - /var/run/dbus:/var/run/dbus
  #   ports:
  #     - 8001:8000
  #   privileged: true
  #   network_mode: host
  #   user: "0:0"
  #   restart: unless-stopped
  
  # # Python FastAPI API service
  ra_backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      args:
        API_PORT: ${API_PORT}
    container_name: ra_backend
    environment:
      # These are now primarily for internal Docker networking/Grafana
      # POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      
      API_PORT: ${API_PORT}
      # NEW: Pass YAML config file path and deployment environment
      DB_CONFIG_FILE: ${DB_CONFIG_FILE}
      DEPLOYMENT_ENV: ${DOCKER_DEPLOYMENT_ENV}
      
      # ENABLE_CLOUD_DB, CLOUD_DB_COUNT, CLOUD_DATABASE_URL_X are no longer needed here
      # as they are read directly from the YAML config within the app.
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    # command: ["uvicorn", "api.__main__:backend_api", "--host", "0.0.0.0", "--port", "${API_PORT:-5000}"]
    command: ["uvicorn", "backend.api.main:backend_api", "--host", "0.0.0.0", "--port", "${API_PORT:-5000}"]
    volumes: # NEW: Ensure config directory is mounted
      - ./config:/app/config
    # networks:
    #   - backend



  # TimescaleDB service (Local)
  timescaledb:
    image: timescale/timescaledb:latest-pg16 # CHANGED: Corrected image name
    container_name: timescaledb
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Grafana service
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3001:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  timescaledb_data:
  grafana_data:

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24