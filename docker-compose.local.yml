  ra_host_services:
    build: 
      context: ./
      dockerfile: ./host_services/Dockerfile
      args:
        - APP_WORKDIR=$APP_WORKDIR
        - PROJECT_ROOT=$PROJECT_ROOT  
    image: robylynn/rac:ra_host_services
    container_name: ra_host_services
    hostname: ra_host_services
    environment:
      - APP_WORKDIR=$APP_WORKDIR
      - HOST_SERVICES_PORT=$HOST_SERVICES_PORT
      - CONTAINERIZED=true
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/dbus:/var/run/dbus
    ports:
      - 8001:8000
    privileged: true
    network_mode: host
    user: "0:0"
    restart: unless-stopped
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - default
    ports:
      - "3001:3000"
    user: $PUID
    volumes:
      - $DOCKERDIR/appdata/grafana:/home/roby/r2/r2-frontend/grafana
    environment:
      GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-simple-json-datasource,grafana-worldmap-panel,grafana-piechart-panel"


networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24