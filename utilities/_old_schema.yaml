# This YAML defines the structure and validation rules for the schema.
# The Python script will use this to generate code for both TypeScript (Zod) and Python (Pydantic).
schemas:
  joggingMetadataSchema:
    type: object
    properties:
      message: { type: string }
      version: { type: string }
      pace:
        type: number
        validations: { min: 5 }

  chartTraceMetadataSchema:
    type: array
    elements:
      type: object
      properties:
        table_name: { type: string }
        column: { type: string }
        color: { type: string }

  PlotConfigurationSchema:
    type: object
    properties:
      id: { type: string }
      name: { type: string }
      type:
        type: enum
        valid_values: [line, bar, scatter]
      traces: { ref: chartTraceMetadataSchema }
      max_length:
        type: number
        optional: true

  PlotConfigurationsSchema:
    type: array
    elements: { ref: PlotConfigurationSchema }

  imageMetadataSchema:
    type: object
    properties:
      src:
        type: string
        validations: { url: true }
      altText:
        type: string
        validations: { minlength: 1 }
      caption:
        type: string
        optional: true

  cameraMetadataSchema:
    type: object
    properties:
      source: { type: string }

  uiComponentSchemaBase:
    type: object
    properties:
      id: { type: uuid }
      label:
        type: string
        validations: { minlength: 1 }

  joggingComponentSchema:
    type: object
    properties:
      id: { type: uuid }
      label:
        type: string
        validations: { minlength: 1 }
      type: { type: literal, value: jogging }
      metadata: { ref: joggingMetadataSchema }
  
  chartComponentSchema:
    type: object
    properties:
      id: { type: uuid }
      label:
        type: string
        validations: { minlength: 1 }
      type: { type: literal, value: charts }
      metadata: { ref: PlotConfigurationSchema }

  imageComponentSchema:
    type: object
    properties:
      id: { type: uuid }
      label:
        type: string
        validations: { minlength: 1 }
      type: { type: literal, value: image }
      metadata: { ref: imageMetadataSchema }

  cameraComponentSchema:
    type: object
    properties:
      id: { type: uuid }
      label:
        type: string
        validations: { minlength: 1 }
      type: { type: literal, value: camera }
      metadata: { ref: cameraMetadataSchema }

  uiComponentSchema:
    type: union
    discriminator: type
    variants:
      - joggingComponentSchema
      - chartComponentSchema
      - imageComponentSchema
      - cameraComponentSchema
      # - type: object
      #   extends: uiComponentSchemaBase
      #   properties:
      #     type: { type: literal, value: jogging }
      #     metadata: { ref: joggingMetadataSchema }
      # - type: object
      #   extends: uiComponentSchemaBase
      #   properties:
      #     type: { type: literal, value: charts }
      #     metadata: { ref: PlotConfigurationSchema }
      # - type: object
      #   extends: uiComponentSchemaBase
      #   properties:
      #     type: { type: literal, value: image }
      #     metadata: { ref: imageMetadataSchema }
      # - type: object
      #   extends: uiComponentSchemaBase
      #   properties:
      #     type: { type: literal, value: camera }
      #     metadata: { ref: cameraMetadataSchema }

  uiConfigSchema:
    type: object
    properties:
      theme:
        type: enum
        valid_values: [light, dark, system]
        default: system
      layout:
        type: object
        properties:
          sidebarEnabled:
            type: boolean
            default: true
          headerHeight:
            type: number
            validations: { min: 50, max: 200 }
            default: 80
      components:
        type: array
        elements: { ref: uiComponentSchema }
        validations: { min_items: 1 }
      plots: { ref: PlotConfigurationsSchema }
      lastUpdated:
        type: string
        validations: { datetime: true }

  uiConfigApiResponseSchema:
    type: object
    properties:
      client_id: { type: string }
      config_data: { ref: uiConfigSchema }
      last_updated:
        type: string
        validations: { datetime: true, precision: 6 }
